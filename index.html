<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WB.PREDICTION - Selamat Datang</title>
<style>
  :root{
    --ink:#1a1a4e;
    --muted:#5b5b8a;
    --indigo:#3030d8;
    --teal:#1fa88f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100vh;
    background:linear-gradient(160deg,#dfe0ff 0%,#efe3ff 55%,#fde8ec 100%);
    color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px 22px;
    overflow-x:hidden;
    position:relative;
  }
  /* bola & angka melayang */
  .bola{
    position:fixed;bottom:-90px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:rgba(255,255,255,.9);
    background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.85),var(--c) 60%);
    opacity:.55;pointer-events:none;z-index:0;
    animation:naik linear infinite;
  }
  @keyframes naik{
    0%{transform:translateY(0) rotate(0)}
    100%{transform:translateY(-125vh) rotate(360deg)}
  }
  .isi{position:relative;z-index:1;width:100%;max-width:360px;
    display:flex;flex-direction:column;align-items:center;text-align:center}
  /* badut */
  .badut{width:170px;height:170px;animation:goyang 2.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(48,48,216,.25))}
  @keyframes goyang{
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-10px) rotate(3deg)}
  }
  .kedip{transform-box:fill-box;transform-origin:center;animation:kedip 4s infinite}
  @keyframes kedip{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  h1{
    margin:6px 0 4px;font-size:30px;letter-spacing:.5px;
    background:linear-gradient(90deg,#3030d8,#8a3ffc,#e0457b,#3030d8);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:warna 6s linear infinite;
  }
  @keyframes warna{to{background-position:300% 0}}
  .selamat{margin:6px 0 2px;font-size:22px;font-weight:700;color:var(--ink)}
  .doa{margin:0 0 22px;font-size:17px;color:var(--muted);line-height:1.4}
  .doa b{color:#c2185b}
  .pilih{
    position:relative;overflow:hidden;
    display:block;width:100%;padding:16px 18px;margin-bottom:14px;
    border-radius:18px;text-decoration:none;color:#fff;
    box-shadow:0 8px 18px rgba(48,48,216,.25);
    transition:transform .15s ease;
  }
  .pilih strong{display:block;font-size:19px}
  .pilih small{display:block;margin-top:3px;font-size:13px;opacity:.9}
  .pilih:active{transform:scale(.96)}
  .pilih:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .satu{background:linear-gradient(135deg,#3030d8,#6a4bff)}
  .dua{background:linear-gradient(135deg,#1fa88f,#2bc2a8);color:#063d33}
  .dua small,.dua strong{color:#fff}
  .pilih::after{
    content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:kilau 3.2s ease-in-out infinite;
  }
  .dua::after{animation-delay:1.4s}
  @keyframes kilau{0%{left:-70%}55%,100%{left:140%}}
  .kaki{margin-top:10px;font-size:13px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){
    .badut,.kedip,h1,.pilih::after,.bola{animation:none}
  }
</style>
</head>
<body>

<div class="isi">
  <svg class="badut" viewBox="0 0 200 200" role="img" aria-label="Badut tersenyum">
    <circle cx="45" cy="92" r="28" fill="#ff5c8a"/>
    <circle cx="155" cy="92" r="28" fill="#2bc2d8"/>
    <circle cx="100" cy="108" r="58" fill="#ffe6d5" stroke="#e3bda5" stroke-width="2"/>
    <polygon points="68,66 132,66 100,14" fill="#3030d8"/>
    <rect x="66" y="62" width="68" height="8" rx="4" fill="#ffd23f"/>
    <circle cx="100" cy="13" r="8" fill="#ffd23f"/>
    <path d="M66 86 Q80 76 92 86" stroke="#1a1a4e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M108 86 Q120 76 134 86" stroke="#1a1a4e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g class="kedip">
      <ellipse cx="80" cy="99" rx="9" ry="11" fill="#fff"/>
      <circle cx="82" cy="100" r="4.5" fill="#1a1a4e"/>
    </g>
    <g class="kedip">
      <ellipse cx="120" cy="99" rx="9" ry="11" fill="#fff"/>
      <circle cx="118" cy="100" r="4.5" fill="#1a1a4e"/>
    </g>
    <circle cx="68" cy="122" r="9" fill="#ff9aa8" opacity=".6"/>
    <circle cx="132" cy="122" r="9" fill="#ff9aa8" opacity=".6"/>
    <circle cx="100" cy="116" r="13" fill="#ff3b4e"/>
    <circle cx="95" cy="111" r="4" fill="#fff" opacity=".7"/>
    <path d="M66 134 Q100 176 134 134 Q100 150 66 134 Z" fill="#d81b3c"/>
    <path d="M100 172 L72 160 L72 186 Z" fill="#ffd23f"/>
    <path d="M100 172 L128 160 L128 186 Z" fill="#ffd23f"/>
    <circle cx="100" cy="173" r="7" fill="#3030d8"/>
  </svg>

  <h1>WB.PREDICTION</h1>
  <p class="selamat">Selamat datang!</p>
  <p class="doa">Semoga <b>hoki</b> dan <b>beruntung</b> hari ini 🍀</p>

  <a class="pilih satu" href="https://alifavif-cmd.github.io/-WONGBAGUS-PREDICTION-/">
    <strong>WongBagus Prediction</strong>
    <small>Ketuk untuk masuk</small>
  </a>
  <a class="pilih dua" href="https://scenangka.github.io/Scenangka/blog.html">
    <strong>Scenangka</strong>
    <small>Ketuk untuk buka blog</small>
  </a>

  <div class="kaki">Silakan pilih salah satu</div>
</div>

<script>
  var warna=['#7b7bff','#ff8fb1','#4fd1c5','#ffb86b','#a78bfa'];
  for(var i=0;i<16;i++){
    var b=document.createElement('div');
    var u=34+Math.random()*50;
    b.className='bola';
    b.textContent=Math.floor(Math.random()*10);
    b.style.cssText='width:'+u+'px;height:'+u+'px;font-size:'+(u*0.5)+'px;left:'+(Math.random()*95)+'%;'
      +'--c:'+warna[i%warna.length]+';'
      +'animation-duration:'+(9+Math.random()*10)+'s;animation-delay:-'+(Math.random()*14)+'s';
    document.body.appendChild(b);
  }
</script>
</body>
</html>
