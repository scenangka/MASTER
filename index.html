<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WB.PREDICTION - Selamat Datang</title>
<style>
  :root{--ink:#1a1a4e;--muted:#5b5b8a}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100vh;
    background:linear-gradient(160deg,#dfe0ff 0%,#efe3ff 55%,#fde8ec 100%);
    color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 22px;overflow-x:hidden;position:relative;
  }
  .bola{
    position:fixed;bottom:-90px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:rgba(255,255,255,.9);
    background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.85),var(--c) 60%);
    opacity:.35;pointer-events:none;z-index:0;
    animation:naik linear infinite;
  }
  @keyframes naik{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-125vh) rotate(360deg)}}
  .isi{position:relative;z-index:1;width:100%;max-width:360px;
    display:flex;flex-direction:column;align-items:center;text-align:center}

  /* anak belajar + angka naik dari buku */
  .logo{position:relative;width:290px;margin-top:14px;cursor:pointer;
    transform-origin:50% 100%;
    animation:gerak 2.4s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent}
  .logo img{width:100%;height:auto;display:block;
    filter:drop-shadow(0 10px 12px rgba(48,48,216,.22))}
  .tulis{position:absolute;left:37%;top:71%;z-index:3;pointer-events:none;
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;font-weight:700;color:#2a2a9a;white-space:nowrap;padding:2px 4px;
    transform:rotate(13deg);transform-origin:0 0;clip-path:inset(0 100% 0 0)}
  .terbang{position:fixed;left:0;top:0;z-index:50;pointer-events:none;white-space:nowrap;
    font-family:Georgia,"Times New Roman",serif;
    font-size:13px;font-weight:700;color:#2a2a9a;text-shadow:0 0 8px currentColor;will-change:transform}
  @keyframes gerak{
    0%,100%{transform:translateY(0) rotate(-2.2deg) scale(1)}
    25%{transform:translateY(-9px) rotate(0deg) scale(1.025)}
    50%{transform:translateY(0) rotate(2.2deg) scale(1)}
    75%{transform:translateY(-6px) rotate(0deg) scale(1.015)}
  }
  .keluar{position:absolute;left:51%;top:68%;width:0;height:0;pointer-events:none;z-index:2}
  .angka{
    position:absolute;left:0;top:0;
    font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
    font-weight:900;line-height:1;
    -webkit-text-stroke:2.5px #2a1a10;paint-order:stroke fill;
    opacity:0;
    animation:muncul 3s ease-out forwards;
  }
  @keyframes muncul{
    0%{opacity:0;transform:translate(-50%,0) scale(.2) rotate(0)}
    14%{opacity:1}
    65%{opacity:1}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-175px) scale(1.1) rotate(var(--rot))}
  }

  h1{
    margin:12px 0 4px;font-size:29px;letter-spacing:.5px;
    background:linear-gradient(90deg,#3030d8,#8a3ffc,#e0457b,#3030d8);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:warna 6s linear infinite;
  }
  @keyframes warna{to{background-position:300% 0}}
  .selamat{margin:6px 0 2px;font-size:22px;font-weight:700}
  .doa{margin:0 0 20px;font-size:15.5px;color:var(--muted);line-height:1.4;white-space:nowrap}
  .doa b{color:#c2185b}
  .pilih{
    position:relative;overflow:hidden;display:block;width:100%;
    padding:16px 18px;margin-bottom:14px;border-radius:18px;
    text-decoration:none;color:#fff;
    box-shadow:0 8px 18px rgba(48,48,216,.25);transition:transform .15s ease,opacity .5s ease;
  }
  .pilih strong{display:block;font-size:19px;
    text-shadow:0 0 6px rgba(255,255,255,.85),0 0 14px rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.35);
    animation:menyala 2.4s ease-in-out infinite}
  .pilih small{display:block;margin-top:3px;font-size:14px;font-weight:700;opacity:1;color:#ffe066;
    text-shadow:0 0 5px rgba(255,224,102,.95),0 0 12px rgba(255,200,60,.6),0 1px 2px rgba(0,0,0,.45);
    animation:menyalaEmas 2.4s ease-in-out infinite}
  @keyframes menyala{50%{text-shadow:0 0 10px #fff,0 0 22px rgba(255,255,255,.85),0 1px 2px rgba(0,0,0,.35)}}
  @keyframes menyalaEmas{50%{text-shadow:0 0 10px #ffe066,0 0 22px rgba(255,200,60,.9),0 1px 2px rgba(0,0,0,.4)}}
  .pilih:active{transform:scale(.96)}
  .pilih:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .satu{background:linear-gradient(135deg,#3030d8,#6a4bff)}
  .dua{background:linear-gradient(135deg,#1fa88f,#2bc2a8)}
  .pilih::after{
    content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:kilau 3.2s ease-in-out infinite;
  }
  .dua::after{animation-delay:1.4s}
  @keyframes kilau{0%{left:-70%}55%,100%{left:140%}}
  .kaki{margin-top:8px;font-size:13px;color:var(--muted)}
  @media (prefers-reduced-motion:reduce){
    .logo,h1,.pilih::after,.bola,.pilih strong,.pilih small{animation:none}
    .angka{display:none}
  }
</style>
</head>

  <h1>WB.PREDICTION</h1>
  <p class="selamat">Selamat datang!</p>

<script>
  /* bola melayang di latar */
  var warna=['#7b7bff','#ff8fb1','#4fd1c5','#ffb86b','#a78bfa'];
  for(var i=0;i<12;i++){
    var b=document.createElement('div');
    var u=34+Math.random()*50;
    b.className='bola';
    b.textContent=Math.floor(Math.random()*10);
    b.style.cssText='width:'+u+'px;height:'+u+'px;font-size:'+(u*0.5)+'px;left:'+(Math.random()*95)+'%;'
      +'--c:'+warna[i%warna.length]+';'
      +'animation-duration:'+(10+Math.random()*10)+'s;animation-delay:-'+(Math.random()*14)+'s';
    document.body.appendChild(b);
  }

  /* angka naik dari buku (menyamping supaya wajah anak tidak tertutup) */
  var box=document.getElementById('keluar');
  var cat=['#d33f3f','#f08a30','#2f98ee','#ffee33','#3fbf6a'];
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    var sisi=1;
    function lahir(){
      sisi=-sisi;
      var s=document.createElement('span');
      s.className='angka';
      s.textContent=Math.floor(Math.random()*10);
      s.style.color=cat[Math.floor(Math.random()*cat.length)];
      s.style.left=(sisi*(28+Math.random()*34))+'px';
      s.style.setProperty('--dx',(sisi*(25+Math.random()*60))+'px');
      s.style.setProperty('--rot',(Math.random()*70-35)+'deg');
      s.style.fontSize=(28+Math.random()*18)+'px';
      s.addEventListener('animationend',function(){s.remove()});
      box.appendChild(s);
    }
    lahir();
    setInterval(lahir,450);
  }

  /* anak menulis nama situs, tulisannya melayang masuk ke tombol */
  (function(){
    var btns=[document.getElementById('b1'),document.getElementById('b2')];
    var teks=['WongBagus Prediction','Scenangka'];
    var tulis=document.getElementById('tulis');
    var logo=document.querySelector('.logo');
    var jalan=false;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!tulis.animate)return;
    function tunggu(ms){return new Promise(function(r){setTimeout(r,ms)})}
    function ukur(el){var r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect()}
    async function main(){
      if(jalan)return; jalan=true;
      try{
        await tunggu(500);
        for(var i=0;i<2;i++){
          tulis.textContent=teks[i];
          var tl=tulis.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)'}],
            {duration:400+teks[i].length*80,easing:'steps(20,end)',fill:'forwards'});
          await tl.finished;
          await tunggu(250);
          var sr=tulis.getBoundingClientRect();
          var fly=document.createElement('span');
          fly.className='terbang';fly.textContent=teks[i];
          document.body.appendChild(fly);
          var fw=fly.offsetWidth,fh=fly.offsetHeight;
          var tr=ukur(btns[i].querySelector('strong'));
          var sx=sr.left+sr.width/2-fw/2, sy=sr.top+sr.height/2-fh/2;
          var tx=tr.left+tr.width/2-fw/2, ty=tr.top+tr.height/2-fh/2;
          var k=tr.width/fw, mid=(1+k)/2, my=Math.min(sy,ty)-45;
          tl.cancel(); tulis.textContent='';
          await fly.animate([
            {transform:'translate('+sx+'px,'+sy+'px) rotate(13deg) scale(1)',color:'#2a2a9a',offset:0},
            {transform:'translate('+((sx+tx)/2)+'px,'+my+'px) rotate(5deg) scale('+mid+')',color:'#8a3ffc',offset:.5},
            {transform:'translate('+tx+'px,'+ty+'px) rotate(0deg) scale('+k+')',color:'#ffffff',offset:1}
          ],{duration:1200,easing:'ease-in-out',fill:'forwards'}).finished;
          (function(f){f.animate([{opacity:1},{opacity:0}],{duration:350,fill:'forwards'}).finished.then(function(){f.remove()})})(fly);
          await tunggu(350);
        }
      }catch(e){}
      jalan=false;
    }
    window.addEventListener('load',main);
    logo.addEventListener('click',main);
  })();
</script>
